<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rajzeszközök</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .card-img-top{
            height:220px;
            object-fit:cover;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="index.html">Tanszer Webáruház</a>
    </div>
</nav>

<div class="container mt-3">
    <a href="index.html" class="btn btn-outline-primary">
        ← Vissza a főoldalra
    </a>
</div>

<div class="container py-5">
    <h1 class="text-center mb-5">Rajzeszközök</h1>

    <div class="row g-4">

        <div class="col-md-4">
            <div class="card h-100 shadow">
                <img src="kepek/festopaletta.jpg"
                     class="card-img-top" alt="Színes ceruza">

                <div class="card-body">
                    <h5>Festőpaletta</h5>
                    <p class="fw-bold text-primary">749 Ft</p>
                    <button class="btn btn-primary">Kosárba</button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card h-100 shadow">
                <img src="kepek/tempera.jpg"
                     class="card-img-top" alt="Tempera">

                <div class="card-body">
                    <h5>Tempera</h5>
                    <p class="fw-bold text-primary">819 Ft</p>
                    <button class="btn btn-primary">Kosárba</button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card h-100 shadow">
                <img src="kepek/vizfestek.webp"
                     class="card-img-top" alt="Vízfesték">

                <div class="card-body">
                    <h5>Vízfesték</h5>
                    <p class="fw-bold text-primary">1590 Ft</p>
                    <button class="btn btn-primary">Kosárba</button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card h-100 shadow">
                <img src="kepek/zsirkreta.jpg"
                     class="card-img-top" alt="Zsírkréta">

                <div class="card-body">
                    <h5>Zsírkréta</h5>
                    <p class="fw-bold text-primary">890 Ft</p>
                    <button class="btn btn-primary">Kosárba</button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card h-100 shadow">
                <img src="kepek/ecset.jpg"
                     class="card-img-top" alt="Ecsetkészlet">

                <div class="card-body">
                    <h5>Ecsetkészlet</h5>
                    <p class="fw-bold text-primary">1290 Ft</p>
                    <button class="btn btn-primary">Kosárba</button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card h-100 shadow">
                <img src="kepek/rajzlap.jpg"
                     class="card-img-top" alt="Rajzlap">

                <div class="card-body">
                    <h5>Rajzlap csomag</h5>
                    <p>20 darab A4-es rajzlap.</p>
                    <p class="fw-bold text-primary">690 Ft</p>
                    <button class="btn btn-primary">Kosárba</button>
                </div>
            </div>
        </div>

    </div>
</div>

<footer class="bg-primary text-white text-center py-3 mt-5">
    <p class="mb-0">© 2026 Tanszer Webáruház</p>
</footer>

</body>
</html>
